
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xadrez Online</title>

  <!-- Arquivo CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>♟ Xadrez Online</h1>

  <div id="status">Preparando o tabuleiro...</div>
  <div id="board"></div>

  <div class="controls">
    <button onclick="restartGame()">Novo jogo</button>
    <button onclick="flipBoard()">Girar tabuleiro</button>
    <button onclick="undoMove()">Desfazer</button>
  </div>

  <div id="message" aria-live="polite"></div>
  <p class="note">Jogue com outra pessoa no mesmo computador.</p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <script>
    function showError() {
      document.getElementById("status").textContent =
        "Não foi possível carregar as regras do xadrez.";

      document.getElementById("message").textContent =
        "Verifique sua internet e atualize a página.";
    }

    function startGame() {
      if (typeof Chess === "undefined") {
        showError();
        return;
      }

      const game = new Chess();
      const board = document.getElementById("board");
      const status = document.getElementById("status");
      const message = document.getElementById("message");

      let selected = null;
      let moves = [];
      let flipped = false;

      const symbols = {
        wK: "brancas_rei.png",
        wQ: "brancas_dama.png",
        wR: "brancas_torre.png",
        wB: "brancas_bispo.png",
        wN: "brancas_cavalo.png",
        wP: "brancas_peao.png",

        bK: "pretas_rei.png",
        bQ: "pretas_dama.png",
        bR: "pretas_torre.png",
        bB: "pretas_bispo.png",
        bN: "pretas_cavalo.png",
        bP: "pretas_peao.png"
      };

      function updateStatus() {
        if (game.in_checkmate()) {
          status.textContent =
            "Xeque-mate! " +
            (game.turn() === "w" ? "Pretas" : "Brancas") +
            " venceram!";
        } else if (game.in_stalemate()) {
          status.textContent = "Empate por afogamento!";
        } else if (game.in_draw()) {
          status.textContent = "Partida empatada!";
        } else {
          status.textContent =
            "Vez das " +
            (game.turn() === "w" ? "brancas" : "pretas") +
            (game.in_check() ? " — XEQUE!" : "");
        }
      }

      function renderBoard() {
        board.innerHTML = "";

        const files = flipped
          ? ["h", "g", "f", "e", "d", "c", "b", "a"]
          : ["a", "b", "c", "d", "e", "f", "g", "h"];

        const ranks = flipped
          ? [1, 2, 3, 4, 5, 6, 7, 8]
          : [8, 7, 6, 5, 4, 3, 2, 1];

        ranks.forEach((rank, row) => {
          files.forEach((file, col) => {
            const name = file + rank;
            const piece = game.get(name);
            const square = document.createElement("button");

            square.type = "button";
            square.className =
              "square " +
              ((row + col) % 2 === 0 ? "light" : "dark");

            square.setAttribute("aria-label", name);

            if (selected === name) {
              square.classList.add("selected");
            }

            const move = moves.find(m => m.to === name);

            if (move) {
              square.classList.add(
                move.captured || move.flags.includes("e")
                  ? "takes"
                  : "target"
              );
            }

            if (piece) {
              const img = document.createElement("img");

              img.className = "piece-img";
              img.src = symbols[
                piece.color + piece.type.toUpperCase()
              ];
              img.alt = piece.type;

              square.appendChild(img);
            }

            square.addEventListener("click", () => clickSquare(name));
            board.appendChild(square);
          });
        });

        updateStatus();
      }

      function clickSquare(name) {
        if (game.game_over()) return;

        const piece = game.get(name);

        if (selected) {
          const possible = moves.find(m => m.to === name);

          if (possible) {
            let promotion = "q";

            if (possible.flags.includes("p")) {
              const answer = prompt(
                "Promover peão: D = dama, T = torre, B = bispo, C = cavalo",
                "D"
              );

              const options = {
                d: "q", t: "r", b: "b", c: "n"
              };

              promotion = options[
                (answer || "d").toLowerCase()
              ] || "q";
            }

            try {
              game.move({
                from: selected,
                to: name,
                promotion: promotion
              });

              selected = null;
              moves = [];
              message.textContent = "";
              renderBoard();
              return;
            } catch (error) {
              message.textContent = "Jogada inválida.";
            }
          }
        }

        if (piece && piece.color === game.turn()) {
          selected = name;
          moves = game.moves({
            square: name,
            verbose: true
          });
          message.textContent = "Escolha uma casa destacada.";
        } else {
          selected = null;
          moves = [];
          message.textContent = "Selecione uma peça da sua cor.";
        }

        renderBoard();
      }

      window.restartGame = function() {
        game.reset();
        selected = null;
        moves = [];
        message.textContent = "";
        renderBoard();
      };

      window.undoMove = function() {
        if (game.undo()) {
          selected = null;
          moves = [];
          message.textContent = "Jogada desfeita.";
          renderBoard();
        }
      };

      window.flipBoard = function() {
        flipped = !flipped;
        renderBoard();
      };

      renderBoard();
    }

    startGame();
  </script>
</body>
</html>
